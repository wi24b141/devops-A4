name: CI/CD Deployment Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed so commitlint can see the last commit

      - name: Generate dynamic version
        id: version
        run: |
          VERSION="$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Lint
        run: |
          bun install
          bun run lint:commit

      - name: Install and Build
        run: |
          bun install
          bun run build
          zip -r build.zip dist/ action.yml package.json README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
          retention-days: 5

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Staging Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_TAG: ${{ vars.BUILD_TAG }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          TAG="${BASE_TAG}-${VERSION}"
          echo "Creating release with tag: $TAG"
          gh release create "$TAG" build.zip \
            --notes "$NOTE" \
            --title "Staging Release $TAG" \
            --repo "$GH_REPO"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create Production Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BASE_TAG: ${{ vars.BUILD_TAG }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          TAG="${BASE_TAG}-${VERSION}"
          echo "Creating release with tag: $TAG"
          gh release create "$TAG" build.zip \
            --notes "$NOTE" \
            --title "Production Release $TAG" \
            --repo "$GH_REPO"